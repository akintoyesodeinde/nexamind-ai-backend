openapi: 3.1.0
info:
  title: NexaMind AI REST API
  version: 1.0.0-phase3
  description: >
    Enterprise Generative AI Knowledge & Workflow Automation Platform API.
    All tenant-scoped endpoints require an authenticated Sanctum session or bearer token
    and a valid `X-Tenant-ID` UUID header corresponding to an active organization membership.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local Docker development server
tags:
  - name: Health
  - name: Auth
  - name: Tenancy
  - name: Knowledge
  - name: Documents
  - name: Retrieval
  - name: AI
  - name: Conversations
  - name: Audit
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: nexamind_session
    sanctumBearer:
      type: http
      scheme: bearer
  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Active organization UUID.
  schemas:
    Meta:
      type: object
      required: [request_id, timestamp]
      properties:
        request_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          $ref: '#/components/schemas/Meta'
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: Application process is alive
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (verifies SQL Server connectivity)
      responses:
        '200':
          description: Application and SQL Server database are ready
        '503':
          description: Dependency unavailable
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      responses:
        '201':
          description: Registered and authenticated
        '422':
          description: Validation error
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      summary: Revoke active session or bearer token
      responses:
        '200':
          description: Signed out
  /me:
    get:
      tags: [Auth]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      summary: Return current user profile, memberships, and role permissions
      responses:
        '200':
          description: Current user payload
  /me/profile:
    patch:
      tags: [Auth]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      summary: Update current user profile and preferences
      responses:
        '200':
          description: Updated user
  /tenants:
    post:
      tags: [Tenancy]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      summary: Create a new organization and assign caller as Owner
      responses:
        '201':
          description: Tenant created
  /tenants/current:
    get:
      tags: [Tenancy]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Retrieve current tenant details, settings, permissions, and summary stats
      responses:
        '200':
          description: Tenant payload
        '403':
          description: User is not a member of the requested tenant
  /tenants/current/settings:
    patch:
      tags: [Tenancy]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Update tenant AI budgets, upload limits, and approval policies (Owner/Admin)
      responses:
        '200':
          description: Updated tenant settings
  /tenants/current/members:
    get:
      tags: [Tenancy]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: List members of the current tenant
      responses:
        '200':
          description: Member list
    post:
      tags: [Tenancy]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Invite or add a member with an RBAC role (Owner/Admin)
      responses:
        '201':
          description: Member added
  /tenants/current/members/{membershipId}:
    patch:
      tags: [Tenancy]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Update a member's role or membership status (Owner/Admin)
      responses:
        '200':
          description: Member updated
    delete:
      tags: [Tenancy]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: Remove a member from the tenant (cannot remove last Owner)
      responses:
        '204':
          description: Member removed
  /roles:
    get:
      tags: [Tenancy]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      summary: List platform RBAC roles and permission definitions
      responses:
        '200':
          description: Roles list
  /knowledge-bases:
    get:
      tags: [Knowledge]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: List knowledge bases the authenticated user is permitted to read
      responses:
        '200': { description: Permitted knowledge bases }
    post:
      tags: [Knowledge]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Create a new knowledge base (Owner/Admin/Manager)
      responses:
        '201': { description: Knowledge base created }
  /knowledge-bases/{id}/permissions:
    get:
      tags: [Knowledge]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: List knowledge base ACL grants
      responses:
        '200': { description: Knowledge base ACL entries }
    put:
      tags: [Knowledge]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Replace knowledge base ACL grants
      responses:
        '200': { description: Updated ACL entries }
  /documents:
    get:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: List ACL-authorized documents in the current tenant
      responses:
        '200': { description: Authorized documents }
    post:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Upload a validated document (or new version) into private Azure Blob Storage and enqueue ingestion
      responses:
        '201': { description: Document uploaded and queued/ingested }
        '422': { description: Validation or security check failed }
  /documents/{id}:
    get:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Retrieve authorized document details
      responses:
        '200': { description: Document details }
    delete:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Delete document, chunks, and blobs
      responses:
        '204': { description: Deleted }
  /documents/{id}/status:
    get:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Poll asynchronous ingestion status
      responses:
        '200': { description: Ingestion status }
  /documents/{id}/versions:
    get:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: List document version history
      responses:
        '200': { description: Version history }
  /documents/{id}/chunks:
    get:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Inspect extracted semantic chunks with page and heading references
      responses:
        '200': { description: Document chunks }
  /documents/{id}/download-url:
    get:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Issue short-lived Azure Blob Service SAS download URL
      responses:
        '200': { description: Temporary signed download URL }
  /documents/{id}/permissions:
    get:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Get document access policy and ACL grants
      responses:
        '200': { description: Document ACL configuration }
    put:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Update document access policy (`inherit` or `restricted`) and ACL grants
      responses:
        '200': { description: Updated document ACLs }
  /retrieval/search:
    post:
      tags: [Retrieval]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Pre-retrieval ACL-enforced SQL Server 2025 / Azure SQL vector similarity search
      responses:
        '200': { description: Ranked authorized document chunks }
        '403': { description: Unauthorized or cross-tenant knowledge base requested }
  /ai/models:
    get:
      tags: [AI]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: List active AI chat and embedding model aliases available to the tenant
      responses:
        '200': { description: Active AI models }
  /documents/{id}/analyze:
    post:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Run grounded AI summarize, classify, or extract_structured analysis on an authorized document
      responses:
        '200': { description: Structured AI document analysis with usage and cost }
  /documents/compare:
    post:
      tags: [Documents]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Compare two ACL-authorized documents side-by-side
      responses:
        '200': { description: Grounded policy comparison }
  /conversations:
    get:
      tags: [Conversations]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: List active tenant-scoped conversations owned by the caller
      responses:
        '200': { description: Conversation list }
    post:
      tags: [Conversations]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Start a new grounded AI conversation
      responses:
        '201': { description: Conversation created }
  /conversations/{id}:
    get:
      tags: [Conversations]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Retrieve conversation details, message history, and verified citations
      responses:
        '200': { description: Conversation transcript }
  /conversations/{id}/messages:
    post:
      tags: [Conversations]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Submit a grounded RAG question and receive verified citations, usage, and cost
      responses:
        '201': { description: Grounded AI answer or safe abstention }
        '429': { description: Tenant monthly token or USD cost quota exceeded }
  /conversations/{id}/stream:
    get:
      tags: [Conversations]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Stream grounded AI response via Server-Sent Events (message.started, message.delta, message.completed, message.failed)
      responses:
        '200': { description: text/event-stream SSE response }
  /messages/{messageId}/feedback:
    post:
      tags: [Conversations]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Submit positive or negative quality feedback on an assistant response
      responses:
        '200': { description: Updated message feedback }
  /audit-logs:
    get:
      tags: [Audit]
      security: [{ sanctumCookie: [] }, { sanctumBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      summary: Search tenant-scoped tamper-evident audit logs (Owner/Admin/Manager)
      responses:
        '200':
          description: Paginated audit log entries
        '403':
          description: Forbidden for Member/Viewer or cross-tenant access
