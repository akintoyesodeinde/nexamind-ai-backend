name: Rollback Backend on Azure VM (Docker Hub + Entra OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Deployment Environment
        required: true
        default: azure-dev
        type: choice
        options:
          - azure-dev
      target_image_tag:
        description: Optional verified Docker Hub tag (leave blank to auto-use /opt/nexamind/releases/backend.previous)
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: nexamind-backend-deploy-${{ inputs.environment || 'azure-dev' }}
  cancel-in-progress: false

jobs:
  rollback-backend:
    name: Rollback nexamind-backend Container via Entra OIDC VM Run Command
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'azure-dev' }}
    timeout-minutes: 15

    steps:
      - name: Authenticate to Azure via Microsoft Entra OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Execute Rollback on Azure VM & Verify Readiness
        run: |
          cat <<'SCRIPT' > /tmp/rollback-backend.sh
          #!/usr/bin/env bash
          set -euo pipefail
          TARGET_TAG="${1:-}"
          if [ -z "${TARGET_TAG}" ] && [ -f /opt/nexamind/releases/backend.previous ]; then
            TARGET_TAG=$(cat /opt/nexamind/releases/backend.previous | tr -d '[:space:]')
          fi
          if [ -z "${TARGET_TAG}" ]; then
            echo "ERROR: No target_image_tag specified and /opt/nexamind/releases/backend.previous is absent."
            exit 1
          fi

          sed -i "s|^BACKEND_IMAGE_TAG=.*|BACKEND_IMAGE_TAG=${TARGET_TAG}|" /opt/nexamind/.env.deploy
          docker compose --env-file /opt/nexamind/.env.deploy -f /opt/nexamind/compose.prod.yaml pull backend
          docker compose --env-file /opt/nexamind/.env.deploy -f /opt/nexamind/compose.prod.yaml up -d --no-deps backend

          for i in $(seq 1 12); do
            if docker exec nexamind-backend curl -fsS http://127.0.0.1:8080/api/v1/health/ready; then
              echo ""
              echo "${TARGET_TAG}" > /opt/nexamind/releases/backend.current
              echo "BACKEND_ROLLBACK_VERIFIED=${TARGET_TAG}"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Post-rollback backend readiness check failed."
          exit 1
          SCRIPT

          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts @/tmp/rollback-backend.sh \
            --parameters "${{ inputs.target_image_tag }}" \
            --query "value[0].message" -o tsv | tee /tmp/vm-rollback.log

          grep -q "BACKEND_ROLLBACK_VERIFIED=" /tmp/vm-rollback.log
