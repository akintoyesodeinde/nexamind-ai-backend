name: Deploy Backend to Azure VM (Docker Hub + Entra OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Deployment Environment
        required: true
        default: azure-dev
        type: choice
        options:
          - azure-dev
      run_migrations:
        description: Run php artisan migrate --force during deployment
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: nexamind-backend-deploy-${{ inputs.environment || 'azure-dev' }}
  cancel-in-progress: false

jobs:
  build-scan-push-and-deploy:
    name: Build, Scan, Push to Docker Hub & Deploy via Entra OIDC VM Run Command
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'azure-dev' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute immutable release tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required non-secret deployment variables
        run: |
          for v in DOCKERHUB_USERNAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_VM_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub Environment Variable: ${v}"
              exit 1
            fi
          done
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production backend image locally for vulnerability scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/nexamind-ai-backend:${{ steps.meta.outputs.image_tag }}

      - name: Scan production image with Trivy (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/nexamind-ai-backend:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Authenticate to Docker Hub (Scoped Access Token — Never Account Password)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push immutable versioned image to Docker Hub
        run: |
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/nexamind-ai-backend"
          TAG="${{ steps.meta.outputs.image_tag }}"
          docker push "${IMAGE}:${TAG}"
          if [ -n "${{ steps.meta.outputs.release_tag }}" ]; then
            docker tag "${IMAGE}:${TAG}" "${IMAGE}:${{ steps.meta.outputs.release_tag }}"
            docker push "${IMAGE}:${{ steps.meta.outputs.release_tag }}"
          fi

      - name: Authenticate to Azure via Microsoft Entra OIDC (Zero Client Secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Backend to Azure VM via Secure VM Run Command (No Inbound SSH Needed)
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations != false && 'true' || 'false' }}
        run: |
          COMPOSE_B64=$(base64 -w0 docker/compose.prod.yaml)
          PROXY_B64=$(base64 -w0 docker/nginx/vm-proxy.conf)

          cat <<'SCRIPT' > /tmp/deploy-backend.sh
          #!/usr/bin/env bash
          set -euo pipefail
          DOCKERHUB_USER="$1"
          NEW_TAG="$2"
          RUN_MIGRATIONS="$3"
          COMPOSE_B64="$4"
          PROXY_B64="$5"

          mkdir -p /opt/nexamind/nginx /opt/nexamind/releases
          echo "${COMPOSE_B64}" | base64 -d > /opt/nexamind/compose.prod.yaml
          echo "${PROXY_B64}" | base64 -d > /opt/nexamind/nginx/vm-proxy.conf

          touch /opt/nexamind/.env.deploy
          chmod 640 /opt/nexamind/.env.deploy

          PREV_TAG=$(grep '^BACKEND_IMAGE_TAG=' /opt/nexamind/.env.deploy | cut -d= -f2 || true)
          if [ -n "${PREV_TAG}" ] && [ "${PREV_TAG}" != "${NEW_TAG}" ]; then
            echo "${PREV_TAG}" > /opt/nexamind/releases/backend.previous
          fi

          grep -q '^DOCKERHUB_USERNAME=' /opt/nexamind/.env.deploy \
            && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${DOCKERHUB_USER}|" /opt/nexamind/.env.deploy \
            || echo "DOCKERHUB_USERNAME=${DOCKERHUB_USER}" >> /opt/nexamind/.env.deploy

          grep -q '^BACKEND_IMAGE_TAG=' /opt/nexamind/.env.deploy \
            && sed -i "s|^BACKEND_IMAGE_TAG=.*|BACKEND_IMAGE_TAG=${NEW_TAG}|" /opt/nexamind/.env.deploy \
            || echo "BACKEND_IMAGE_TAG=${NEW_TAG}" >> /opt/nexamind/.env.deploy

          grep -q '^FRONTEND_IMAGE_TAG=' /opt/nexamind/.env.deploy \
            || echo "FRONTEND_IMAGE_TAG=${NEW_TAG}" >> /opt/nexamind/.env.deploy

          if [ ! -f /opt/nexamind/secrets/backend.env ]; then
            echo "ERROR: /opt/nexamind/secrets/backend.env is missing on VM. Provision runtime secrets first."
            exit 1
          fi

          docker compose --env-file /opt/nexamind/.env.deploy -f /opt/nexamind/compose.prod.yaml pull backend
          docker compose --env-file /opt/nexamind/.env.deploy -f /opt/nexamind/compose.prod.yaml up -d --no-deps backend

          if [ "${RUN_MIGRATIONS}" = "true" ]; then
            docker exec nexamind-backend php artisan migrate --force
          fi

          for i in $(seq 1 12); do
            if docker exec nexamind-backend curl -fsS http://127.0.0.1:8080/api/v1/health/ready; then
              echo ""
              echo "${NEW_TAG}" > /opt/nexamind/releases/backend.current
              echo "BACKEND_DEPLOY_VERIFIED=${NEW_TAG}"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Backend readiness check failed after deployment."
          exit 1
          SCRIPT

          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts @/tmp/deploy-backend.sh \
            --parameters "${DOCKERHUB_USERNAME}" "${IMAGE_TAG}" "${RUN_MIGRATIONS}" "${COMPOSE_B64}" "${PROXY_B64}" \
            --query "value[0].message" -o tsv | tee /tmp/vm-deploy.log

          grep -q "BACKEND_DEPLOY_VERIFIED=${IMAGE_TAG}" /tmp/vm-deploy.log
