name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: PHP 8.4 Quality, Migrations & SQL Server 2025 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: NexaMind_CI_Pass2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'NexaMind_CI_Pass2026!' -C -Q 'SELECT 1' -b || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
          --health-start-period 25s

      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
        options: >-
          --health-cmd "node -e \"require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: sqlsrv
      DB_HOST: 127.0.0.1
      DB_PORT: 1433
      DB_DATABASE: nexamind
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 1433
      DB_TEST_DATABASE: nexamind_test
      DB_USERNAME: sa
      DB_PASSWORD: NexaMind_CI_Pass2026!
      DB_ENCRYPT: "yes"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      AZURE_STORAGE_CONTAINER: nexamind-documents
      AZURE_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
      AI_DEFAULT_PROVIDER: mock
      AI_EMBEDDING_DIMENSIONS: 1536

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Microsoft ODBC Driver 18 for SQL Server
        run: |
          if ! odbcinst -q -d 2>/dev/null | grep -qi "ODBC Driver 18 for SQL Server"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq curl gnupg2 ca-certificates unixodbc unixodbc-dev
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            UBUNTU_VER=$(. /etc/os-release && echo "${VERSION_ID}")
            UBUNTU_CODENAME=$(. /etc/os-release && echo "${VERSION_CODENAME}")
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${UBUNTU_VER}/prod ${UBUNTU_CODENAME} main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18
          fi
          odbcinst -q -d

      - name: Setup PHP 8.4 with ODBC 18 & PDO_SQLSRV
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, mbstring, pdo, sqlsrv, pdo_sqlsrv, xml, zip
          tools: composer:v2
          coverage: none

      - name: Verify PHP & SQLSRV extensions
        run: |
          php -v
          php -m | grep -iE "sqlsrv|bcmath|intl|zip"
          odbcinst -q -d

      - name: Validate composer.json and install dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP dependencies for security advisories
        run: composer audit --no-interaction

      - name: Check code style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Run static analysis (Larastan / PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Prepare environment and disposable SQL Server 2025 databases
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php <<'EOF'
          <?php
          $dsn = 'sqlsrv:Server=127.0.0.1,1433;Database=master;Encrypt=1;TrustServerCertificate=1';
          $lastError = 'unknown';
          for ($attempt = 1; $attempt <= 15; $attempt++) {
              try {
                  $pdo = new PDO($dsn, 'sa', 'NexaMind_CI_Pass2026!', [
                      PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                  ]);
                  $pdo->exec("IF DB_ID(N'nexamind') IS NULL CREATE DATABASE [nexamind];");
                  $pdo->exec("IF DB_ID(N'nexamind_test') IS NULL CREATE DATABASE [nexamind_test];");
                  echo "Created disposable CI databases: nexamind, nexamind_test (attempt {$attempt})\n";
                  exit(0);
              } catch (Throwable $e) {
                  $lastError = $e->getMessage();
                  fwrite(STDERR, "Attempt {$attempt} failed: {$lastError}\n");
                  sleep(3);
              }
          }
          echo "::error::Failed to prepare disposable SQL Server 2025 databases: {$lastError}\n";
          exit(1);
          EOF

      - name: Probe SQL Server 2025 & Native VECTOR(1536)
        run: php artisan nexamind:probe-sqlserver

      - name: Verify migrations and seeders on disposable SQL Server database
        run: php artisan migrate:fresh --seed --force

      - name: Run Unit, Feature, Integration & Security test suites
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlsrv_testing
          DB_TEST_DATABASE: nexamind_test
        run: ./vendor/bin/phpunit --testdox

  docker-build-and-scan:
    name: Build & Scan Production Docker Image
    needs: quality-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          tags: nexamind-ai-backend:ci-${{ github.sha }}

      - name: Scan container image with Trivy (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexamind-ai-backend:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  iac-bicep-and-workflow-validation:
    name: Lint & Compile Azure Bicep IaC, Cloud-Init & Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install / verify Azure Bicep CLI
        run: |
          az version
          az bicep install || az bicep upgrade
          az bicep version

      - name: Lint and compile all Azure Bicep modules, optional VMSS, and parameters
        env:
          NEXAMIND_SSH_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICIValidationDummyKeyOnlyNotForUse ci@nexamind.local"
          NEXAMIND_ADMIN_CIDR: "203.0.113.10/32"
          NEXAMIND_SQL_ADMIN_PASSWORD: CI_Validation_Placeholder_Pass2026!
          NEXAMIND_ALERT_EMAIL: "alerts@example.com"
        run: |
          for file in infrastructure/azure/main.bicep infrastructure/azure/modules/*.bicep; do
            echo "Linting ${file}..."
            az bicep lint --file "${file}"
          done
          az bicep build --file infrastructure/azure/main.bicep --outfile /tmp/nexamind-main.json
          az bicep build-params --file infrastructure/azure/parameters/dev.bicepparam --outfile /tmp/nexamind-dev.parameters.json
          echo "All Bicep templates (including optional VMSS) and parameters compiled cleanly!"

      - name: Validate cloud-init, production Compose, and GitHub Actions YAML files
        run: |
          python3 - <<'EOF'
          import glob, yaml

          with open('infrastructure/azure/cloud-init/nexamind-init.yaml', 'r', encoding='utf-8') as f:
              raw = f.read()
          assert raw.startswith('#cloud-config'), "cloud-init must start with #cloud-config"
          ci_data = yaml.safe_load(raw)
          assert isinstance(ci_data, dict) and 'runcmd' in ci_data, "Invalid cloud-init YAML"
          print("Valid cloud-init YAML: infrastructure/azure/cloud-init/nexamind-init.yaml")

          with open('docker/compose.prod.yaml', 'r', encoding='utf-8') as f:
              compose = yaml.safe_load(f)
          assert isinstance(compose, dict) and 'services' in compose, "Invalid compose.prod.yaml"
          print("Valid Compose YAML: docker/compose.prod.yaml")

          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, 'r', encoding='utf-8') as f:
                  data = yaml.safe_load(f)
              assert isinstance(data, dict) and 'jobs' in data, f"Invalid workflow: {path}"
              print(f"Valid workflow YAML: {path}")
          EOF
