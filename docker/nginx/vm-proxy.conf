# Production Nginx HTTPS Reverse Proxy for NexaMind AI Azure VM
# Routes /api/* and /sanctum/* to Laravel backend and / to React SPA on the SAME origin
# so Sanctum HttpOnly SameSite=Lax cookies work securely without CORS token storage.

upstream nexamind_backend {
    server backend:8080;
    keepalive 16;
}

upstream nexamind_frontend {
    server frontend:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /proxy-healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ACME HTTP-01 challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Grounded RAG SSE Streaming endpoint — disable buffering so deltas arrive immediately
    location ~ ^/api/v1/conversations/[^/]+/stream$ {
        proxy_pass http://nexamind_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering "no" always;
    }

    # Laravel REST API and Sanctum CSRF endpoint
    location ~ ^/(api|sanctum)/ {
        proxy_pass http://nexamind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # React/TypeScript SPA Frontend
    location / {
        proxy_pass http://nexamind_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
