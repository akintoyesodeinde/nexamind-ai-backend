name: nexamind-ai-prod

# Production Docker Compose stack for the low-cost Azure Linux VM (/opt/nexamind).
# - Pulls immutable versioned images from Docker Hub (zero on-VM image builds).
# - Hosts SQL Server externally on Azure SQL Database Free Offer over TLS 1.2+.
# - Enforces memory limits, restart policies, health checks, and bounded log rotation.
# - Queue worker runs via systemd timer (`queue:work --stop-when-empty`) to preserve 1 GiB VM RAM.

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/nexamind-ai-backend:${BACKEND_IMAGE_TAG}
    container_name: nexamind-backend
    restart: unless-stopped
    env_file:
      - /opt/nexamind/secrets/backend.env
    volumes:
      - nexamind_storage:/var/www/html/storage/app
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nexamind_internal

  frontend:
    image: ${DOCKERHUB_USERNAME}/nexamind-ai-frontend:${FRONTEND_IMAGE_TAG}
    container_name: nexamind-frontend
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nexamind_internal

  proxy:
    image: nginx:1.30.7-alpine
    container_name: nexamind-proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/nexamind/nginx/vm-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/nexamind/certs:/etc/nginx/certs:ro
      - /var/www/certbot:/var/www/certbot:ro
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/proxy-healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nexamind_internal

volumes:
  nexamind_storage:

networks:
  nexamind_internal:
    driver: bridge
